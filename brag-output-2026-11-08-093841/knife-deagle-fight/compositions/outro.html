<template id="outro-template">
  <div data-composition-id="outro" data-width="1920" data-height="1080" data-duration="3.5">
    <div class="container">
      <div class="wordmark" id="outro-wordmark" data-layout-allow-overlap>
        <span class="wm-ghost wm-cyan">KNIFE DEAGLE FIGHT</span>
        <span class="wm-ghost wm-red">KNIFE DEAGLE FIGHT</span>
        <span class="wm-main">KNIFE DEAGLE FIGHT</span>
      </div>
      <div class="tagline" id="outro-tagline">Two-hit Deagle. Swing first.</div>
      <div class="repopath" id="outro-path">Salar-prog/knife-deagle-fight</div>
    </div>

    <style>
      [data-composition-id="outro"] .container {
        width: 100%;
        height: 100%;
        background: #08080f;
        position: relative;
        font-family: "Space Grotesk", sans-serif;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      [data-composition-id="outro"] .wordmark {
        position: relative;
        font-size: 132px;
        font-weight: 700;
        letter-spacing: 2px;
        line-height: 1.05;
        text-align: center;
        opacity: 0;
      }

      [data-composition-id="outro"] .wm-ghost {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        mix-blend-mode: screen;
        pointer-events: none;
      }

      [data-composition-id="outro"] .wm-cyan {
        color: #00e5ff;
        transform: translateX(-7px);
      }

      [data-composition-id="outro"] .wm-red {
        color: #ff2e4d;
        transform: translateX(7px);
      }

      [data-composition-id="outro"] .wm-main {
        position: relative;
        color: #f5f5fa;
      }

      [data-composition-id="outro"] .tagline {
        margin-top: 42px;
        font-size: 64px;
        font-weight: 500;
        color: #f5f5fa;
        opacity: 0;
      }

      [data-composition-id="outro"] .repopath {
        margin-top: 60px;
        font-family: "JetBrains Mono", monospace;
        font-size: 34px;
        color: #9999b0;
        letter-spacing: 1px;
        opacity: 0;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        tl.fromTo('[data-composition-id="outro"] #outro-wordmark', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" }, 0.15);
        tl.fromTo('[data-composition-id="outro"] #outro-tagline', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.8);
        tl.fromTo('[data-composition-id="outro"] #outro-path', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.1);
        tl.to('[data-composition-id="outro"] .container', { opacity: 0, duration: 0.35, ease: "power2.in" }, 3.1);

        window.__timelines = window.__timelines || {};
        window.__timelines["outro"] = tl;
      })();
    </script>
  </div>
</template>
