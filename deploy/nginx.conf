# Knife Deagle Fight — nginx reverse proxy (example)
#
# The Node server serves client/dist itself (see server/src/index.js).
# nginx only needs to proxy everything to :3001, with WebSocket upgrade
# headers so Socket.IO works behind the proxy.
#
# Usage: point server_name at your host/IP, copy to /etc/nginx/conf.d/
# or sites-available/, then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Everything → Node (static client + Socket.IO on the same port)
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # Socket.IO — WebSocket upgrade + long-poll fallback
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_read_timeout  86400;
    }

    # Gzip compression (Node serves uncompressed)
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
